<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넥슨 보안센터</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/NEXONLv2Gothic/NEXONLv2Gothic.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/xpressengine/xeicon@2.4.0/xeicon.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <a class="skip-link" href="#main">본문 바로가기</a>

    <header class="site-header">
        <div class="site-header__left">
            <button type="button" class="menu-button" aria-label="메뉴">
                <span class="xi-bars xi-x" aria-hidden="true"></span>
                <span class="menu-button__text special-font">메뉴</span>
            </button>
        </div>

        <a class="site-header__logo" href="#">
            <img src="images/logo.svg" alt="NEXON" width="134" height="24">
        </a>

        <div class="site-header__right">
            <div class="header-actions">
                <ul class="header-icons">
                    <li>
                        <a class="header-icons__link" href="#" aria-label="넥슨X네이버">
                            <img src="images/icon-collab.svg" alt="" width="28" height="14">
                            <span class="header-icons__tip" aria-hidden="true">넥슨X네이버</span>
                        </a>
                    </li>
                    <li>
                        <a class="header-icons__link" href="#" aria-label="선물함">
                            <span class="xi-gift-o xi-x" aria-hidden="true"></span>
                            <span class="header-icons__tip" aria-hidden="true">선물함</span>
                        </a>
                    </li>
                    <li>
                        <a class="header-icons__link" href="#" aria-label="넥슨캐시">
                            <span class="xi-credit-card xi-x" aria-hidden="true"></span>
                            <span class="header-icons__badge" aria-hidden="true">N</span>
                            <span class="header-icons__tip" aria-hidden="true">넥슨캐시</span>
                        </a>
                    </li>
                    <li>
                        <a class="header-icons__link" href="#" aria-label="PC방">
                            <span class="xi-maker xi-x" aria-hidden="true"></span>
                            <span class="header-icons__tip" aria-hidden="true">PC방</span>
                        </a>
                    </li>
                </ul>
                <a class="header-signup special-font" href="#">회원가입</a>
                <a class="button button--pill special-font" href="#">로그인</a>
            </div>

            <a class="header-login-icon" href="#" aria-label="로그인">
                <span class="xi-log-in xi-x" aria-hidden="true"></span>
            </a>
        </div>
    </header>

    <nav class="main-nav" aria-label="주요 메뉴">
        <ul class="main-nav__list">
            <li><a class="main-nav__link special-font" href="#">공지사항</a></li>
            <li><a class="main-nav__link special-font" href="#">이벤트</a></li>
            <li><a class="main-nav__link special-font" href="#">내정보</a></li>
            <li><a class="main-nav__link special-font" href="#">MY결제</a></li>
            <li><a class="main-nav__link main-nav__link--active special-font" href="#" aria-current="page">보안센터</a></li>
            <li><a class="main-nav__link special-font" href="#">고객센터</a></li>
        </ul>
    </nav>

    <main id="main">
        <h1 class="visually-hidden">넥슨 보안센터</h1>

        <section class="section" aria-labelledby="status-title">
            <h2 class="section__title special-font" id="status-title">보안 현황</h2>
            <div class="status-card">
                <div class="status-card__grade grade">
                    <div class="grade__gauge">
                        <img class="grade__img" src="images/grade-unknown.svg" alt="">
                        <button type="button" class="grade__help" popovertarget="grade-help" aria-label="보안 등급 안내 보기">?</button>
                        <p class="grade__level special-font"><span class="grade__mark">?</span> 등급</p>
                    </div>
                    <p class="grade__login"><a class="link" href="#">로그인</a>하고 보안등급 확인하세요.</p>

                    <div class="grade-help" id="grade-help" popover role="dialog" aria-label="보안 등급 안내">
                        <button type="button" class="grade-help__close" popovertarget="grade-help" popovertargetaction="hide" aria-label="닫기">×</button>
                        <p>보안 등급은 보안서비스와 계정 위협 상태 기준으로 산정됩니다.</p>
                        <ul class="grade-help__legend">
                            <li class="pill pill--danger">위험</li>
                            <li class="pill pill--warning">경고</li>
                            <li class="pill pill--caution">주의</li>
                            <li class="pill pill--safe">정상</li>
                        </ul>
                    </div>
                </div>

                <div class="status-card__recommend">
                    <h3 class="status-card__title">나에게 필요한 보안 서비스는?</h3>
                    <p class="status-card__text">지금 <a class="link" href="#">로그인</a>하면 나에게 필요한 보안서비스를 추천해드려요.<br>권장 보안 서비스를 설정하고 계정 보호를 강화하세요!</p>
                    <a class="button button--outline" href="#">로그인</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
